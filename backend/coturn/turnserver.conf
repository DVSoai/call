# Cấu hình coturn cho giai đoạn dev/test local — xem docs/CALL_SYSTEM.md §4.4.
# KHÔNG dùng nguyên file này cho production (đổi realm, secret, TLS thật).

listening-port=3478
# 40000-40020: tránh dải 49152-49251 bị Windows/Hyper-V giữ trước — xem
# ghi chú trong docker-compose.yml.
min-port=40000
max-port=40020

# Cơ chế shared-secret chuẩn coturn: Server (Go) và coturn cùng biết secret
# này, Server tự sinh username/password time-limited (HMAC-SHA1) mà không
# cần gọi API coturn. PHẢI TRÙNG với TURN_SECRET trong backend/.env.
use-auth-secret
static-auth-secret=change-me-dev-secret

realm=call.local

# Cho phép loopback/private IP relay — chỉ bật khi test local qua Docker.
# Production PHẢI bỏ 2 dòng dưới để tránh bị lợi dụng làm open relay.
allow-loopback-peers
no-cli

# Log ra stdout để xem qua `docker logs call_video-coturn`.
log-file=stdout
verbose
