name: call_video_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  dio: ^5.11.0
  # Ghim < 11.0.0: bản 11.0.0 bump compileSdk lên 37, nhưng SDK Platform 37
  # hiện chỉ có bản point-release (37.0/37.1...), chưa có target hash trần
  # "android-37" mà Gradle cần → build fail "Failed to find target with
  # hash string 'android-37'". Gỡ ghim khi Android SDK 37 chính thức phát
  # hành bản trơn (không point-release) hoặc AGP hỗ trợ hash mới.
  flutter_secure_storage: ^10.3.1
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^1.6.0
  permission_handler: ^13.0.1
  connectivity_plus: ^7.3.1
  fpdart: ^1.2.0
  equatable: ^2.1.0
  easy_refresh: ^3.5.1
  logger: ^2.7.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  flutter_dotenv: ^5.2.1
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.4
  flutter_callkit_incoming: ^3.1.5
  # Translated Call (docs/CALL_SYSTEM.md §8) — ASR (Whisper) + VAD
  # (silero-vad) on-device, dùng chung 1 thư viện. record: thu mic ra file
  # WAV cho bài đo baseline độ trễ (§8.6c) — CHỈ dùng cho màn hình đo thử dev,
  # luồng gọi thật vẫn lấy audio qua flutter_webrtc như cũ.
  #
  # GHIM CỨNG 1.13.3 (không dùng ^) — bản mới nhất TRƯỚC lúc sherpa_onnx bump
  # onnxruntime lên 1.27.x (bắt đầu từ 1.13.4, xem CHANGELOG.md của package),
  # nên vẫn bundle onnxruntime ~1.24.x cho Android — TRÙNG với bản chính thức
  # có trên Maven Central. Bản mới hơn (1.13.4+) tự bundle onnxruntime 1.27.x
  # — bản KHÔNG có trên Maven, tạo ra symbol version
  # "OrtGetApiBase@VERS_1.27.x" xung khắc thẳng với "OrtGetApiBase@VERS_1.23.0"
  # mà flutter_onnxruntime kéo về (hardcode trong android/build.gradle của
  # chính plugin đó) — dlopen lỗi "cannot locate symbol OrtGetApiBase" vì
  # bionic linker match versioned symbol tuyệt đối, không có bản .so nào
  # thoả cả 2 bên cùng lúc. Đã verify bằng llvm-nm -D trên .so thật của cả 2
  # bên trước khi ghim version này — xem thêm android/app/build.gradle.kts
  # (chỗ force onnxruntime-android).
  #
  # KHÔNG dùng 1.12.39 (bản đã thử trước, cũng bundle onnxruntime 1.24.3) vì
  # bản đó có bug: 4 gói native Android (arm64/armeabi/x86/x86_64) dùng
  # CHUNG 1 namespace "com.k2fsa.sherpa.onnx" → AGP lỗi
  # "Namespace ... is used in multiple modules". Bug này được fix ở 1.13.0
  # ("Fix building Flutter Android APPs", #3559) — 1.13.3 vừa có fix đó vừa
  # chưa bump onnxruntime.
  sherpa_onnx: 1.13.3
  record: ^6.1.1
  path_provider: ^2.1.5
  # flutter_webrtc's MediaRecorder(audioChannel: OUTPUT) ghi audio người kia
  # ra file .m4a (AAC, native MediaCodec/MediaMuxer bên Android — không phải
  # WAV) — sherpa_onnx chỉ đọc được WAV, cần decode trước. Dùng native
  # platform API (không kéo theo ffmpeg binary nặng vài chục MB).
  audio_decoder: ^0.8.1
  # MT (dịch máy, MarianMT/OPUS-MT ONNX) — flutter_onnxruntime chạy encoder/
  # decoder ONNX tổng quát (verified publisher, cập nhật thường xuyên, KHÔNG
  # dùng onnx_translation vì gói đó không maintain hơn 1 năm, chỉ 24 lượt
  # tải). dart_sentencepiece_tokenizer: Marian dùng SentencePiece, không tự
  # viết tokenizer.
  flutter_onnxruntime: ^1.8.3
  dart_sentencepiece_tokenizer: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1

# permission_handler_android là dependency gián tiếp (qua permission_handler)
# — ghim < 14.0.0 vì lý do giống flutter_secure_storage ở trên (14.0.0 bump
# compileSdk lên 37, target hash "android-37" chưa tồn tại dạng trơn).
dependency_overrides:
  permission_handler_android: 13.0.1
  # sherpa_onnx khai "sherpa_onnx_android_*: ^<version>" — dấu ^ cho phép pub
  # tự chọn bản MỚI HƠN (vd. 1.13.5, bản đang có sẵn trong cache), nên chỉ
  # ghim mỗi package "sherpa_onnx" chính KHÔNG đủ ép các gói native con dùng
  # đúng bản 1.13.3 (bundle onnxruntime ~1.24.x, có trên Maven). Không
  # override thì pub âm thầm lấy lại 1.13.5 (bundle 1.27.1, không có trên
  # Maven) — đúng lỗi "cannot locate symbol OrtGetApiBase" đã gặp.
  sherpa_onnx_android_arm64: 1.13.3
  sherpa_onnx_android_armeabi: 1.13.3
  sherpa_onnx_android_x86: 1.13.3
  sherpa_onnx_android_x86_64: 1.13.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
